plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-rake
  - rubocop-yard
  - rubocop-view_component

AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    - "test/tmp/**/*" # generator-test destinations
    - "test/dummy/tmp/**/*"
    - "lib/generators/poetry/pagination/templates/**/*" # generated host-app code; its style belongs to the host
    - "test/dommy_tier/support/browser_harness.rb" # vendored from dommy-js-quickjs, kept byte-identical
    # Committed eval output: the assembly scripts under each dated run are
    # one-shot records of a finished round ("bundle exec ruby <this file>"),
    # never loaded together and never shipped.
    - "eval/results/**/*"
    # Dev-only tooling (theme porting, visual review, snapshot refresh): same
    # one-shot-cli shape, top-level constants between scripts that never load
    # together, and nothing here ships.
    - "script/**/*"
    - "vendor/**/*"
  NewCops: enable
  SuggestExtensions: false
  # The ViewComponent cops resolve component ancestry through the project
  # index; they raise on the first class they inspect without it.
  UseProjectIndex: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/ParameterLists:
  # Keyword-only signatures are the house norm; counting keywords
  # penalizes self-documenting APIs.
  CountKeywordArgs: false

Metrics/BlockLength:
  # use_stimulus declaration blocks are the component's wiring contract -
  # element-major and legitimately long on multi-element components.
  AllowedMethods:
    - refine
    - use_stimulus
  Exclude:
    - "test/**/*"
    - "*.gemspec"
    # ActiveSupport::Concern `class_methods do ... end` blocks carry the ported DSL.
    - "app/components/poetry/core/concerns/*.rb"
    # Rake namespace blocks are naturally long task lists.
    - "rakelib/**/*.rake"
    - "lib/tasks/**/*.rake"

Naming/FileName:
  # lib/poetry-core.rb is the hyphenated Bundler auto-require entrypoint for the
  # Poetry::Core namespace; its name must match the gem, not snake_case.
  Exclude:
    - "lib/poetry-ui.rb"
    - Archspec.rb # ArchSpec reads the spec by that name

# --- poetry-core framework port ---------------------------------------------
# The framework layer is ported intact from view_component_plus (which used
# `standard`). A few RuboCop defaults flag legitimate, proven patterns in that
# ported code; relax the advisory cops rather than refactor battle-tested logic.

# The ported code is thoroughly YARD-documented, but on the inner modules/classes
# rather than the compact `module Poetry::Core` namespace wrappers.
Style/Documentation:
  Enabled: false

# The fox_tail-derived attribute/stimulus merging methods are inherently dense.
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false

# The Tokens::Color API is keyed on the OKLCH color axes; `l`/`c`/`h` are the
# domain-standard names (defaults for this cop kept, plus the three axes).
Naming/MethodParameterName:
  AllowedNames: ["as", "at", "by", "cc", "db", "id", "if", "in", "io", "ip", "of", "on", "os", "pp", "to", "l", "c", "h", "q"]

# `has_attribute?` is part of the public HTML::Attributes contract; the
# `has_*_attribute?` predicates are part of the public Styles/Options DSL contract.
Naming/PredicatePrefix:
  AllowedMethods:
    - has_attribute?
    - has_style_attribute?
    - has_option_attribute?

# Comprehensive, multi-assertion unit tests are intentional.
Minitest/MultipleAssertions:
  Enabled: false

# YARD tags are the contract the docs, the skill and the agents read;
# the long collection form (Array<String>) is the house style.
YARD/CollectionStyle:
  EnforcedStyle: long

# --- component conventions ----------------------------------------------------

# Component ancestry passes through poetry-core (a sibling engine gem), whose
# catalog lives outside this project; index it so the ViewComponent cops can
# resolve what a component inherits from.
ViewComponent:
  AdditionalSourcePaths:
    - "../poetry-core/app/components"

# Parts - the nested slot classes a component owns (combobox items, menu
# entries, tab triggers, table rows) - are not standalone components and wear
# their DOM part's name; the suffix rule does not apply to them. The outer
# class is always `...::Component`.
ViewComponent/ComponentSuffix:
  Enabled: false

# Previews ship as a sidecar beside the component -
# `app/components/poetry/ui/<name>/preview.rb`, one per component. The cop
# builds its candidates as `<name>_preview.rb` under `PreviewPaths` and tests
# them with File.exist? (no globs), so no PreviewPaths value can describe this
# shape and it flags components that do have a preview.
ViewComponent/MissingPreview:
  Enabled: false

# The cop's default list is ViewComponent's own interface. Poetry adds
# `root_attributes`: the documented, template-facing root-attribute builder
# (`element_tag(:div, **root_attributes)`) that parts and subclasses override.
# The list is restated in full - RuboCop replaces the array, it does not merge
# it with the plugin default.
ViewComponent/PreferPrivateMethods:
  AllowedPublicMethods:
    - initialize
    - call
    - before_render
    - before_render_check
    - render?
    - render_in
    - around_render
    - root_attributes
